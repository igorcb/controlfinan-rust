[package]
name = "controlfinan"
version = "1.0.0"
edition = "2024"
description = "ControlFinan em Rust (Axum), com paridade com a versão Rails 8 + Hotwire"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "rust_decimal"] }
askama = "0.14"
bcrypt = "0.17"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
form_urlencoded = "1"
subtle = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["cookies"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
